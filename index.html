<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado Interativo - Ensino Fundamental I</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .subject-selector { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .subject-btn { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .subject-btn:hover { border-color: #3b82f6; color: #fff; }
    .subject-btn.active { background-color: #2563eb; border-color: #2563eb; color: #fff; }
    .modal-container { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; width: 100%; max-width: 720px; padding: 24px; position: relative; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .modal-header { text-align: center; margin-bottom: 20px; }
    .modal-title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .modal-subtitle { font-size: 13px; color: #94a3b8; }
    .difficulty-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .btn-diff { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-diff.active { background-color: #2563eb; border-color: #2563eb; color: #fff; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; background-color: #0b1120; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
    .questions-wrapper { max-height: 480px; overflow-y: auto; padding-right: 6px; }
    .question-card { background-color: #0b1120; border: 1px solid #1e293b; border-radius: 8px; padding: 18px; margin-bottom: 20px; }
    .question-text { font-size: 14px; line-height: 1.6; color: #fff; margin-bottom: 14px; font-weight: 600; }
    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .option-btn { background-color: #131c2e; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 16px; color: #cbd5e1; font-size: 13px; text-align: left; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { background-color: #1e293b; border-color: #3b82f6; color: #fff; }
    .option-btn.selected { border-color: #3b82f6; background-color: #1d283c; }
    .feedback-box { display: none; border-radius: 8px; padding: 12px 16px; margin-top: 10px; font-size: 13px; }
    .feedback-box.correct { display: block; background-color: #0e1d18; border: 1px solid #10b981; border-left: 4px solid #10b981; color: #e2e8f0; }
    .feedback-box.wrong { display: block; background-color: #1f1315; border: 1px solid #ef4444; border-left: 4px solid #ef4444; color: #e2e8f0; }
    .actions-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid #1e293b; }
    .save-status { font-size: 12px; color: #10b981; opacity: 0; transition: opacity 0.3s; }
    .save-status.visible { opacity: 1; }
    .btn-group-footer { display: flex; gap: 12px; }
    .btn-action { padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-reset { background-color: #334155; color: #fff; }
    .btn-save { background-color: #2563eb; color: #fff; }
    .loading-msg { text-align: center; padding: 20px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="subject-selector">
    <button class="subject-btn active" onclick="switchSubject(this, 'artes')"><i class="fa-solid fa-palette"></i> Artes</button>
    <button class="subject-btn" onclick="switchSubject(this, 'religioso')"><i class="fa-solid fa-hands-praying"></i> Ensino Religioso</button>
    <button class="subject-btn" onclick="switchSubject(this, 'portugues')"><i class="fa-solid fa-book"></i> Língua Portuguesa</button>
  </div>

  <div class="modal-container">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Provas de Artes</h2>
      <p class="modal-subtitle" id="modalSubtitle">Modo: Provas - Ensino Fundamental I</p>
    </div>

    <div class="difficulty-group">
      <button class="btn-diff" onclick="selectDifficulty(this, 'facil')">Pequeno (5 Qs)</button>
      <button class="btn-diff" onclick="selectDifficulty(this, 'medio')">Médio (10 Qs)</button>
      <button class="btn-diff active" onclick="selectDifficulty(this, 'dificil')">Todas as Questões</button>
    </div>

    <div class="status-bar">
      <span>Respondidas: <span id="answeredCount">0</span>/<span id="totalQuestions">0</span></span>
      <span>Banco de Questões Externo</span>
    </div>

    <div class="questions-wrapper" id="questionsContainer">
      <div class="loading-msg">Carregando banco de dados de questões...</div>
    </div>

    <div class="actions-footer">
      <div class="save-status" id="saveStatusIndicator"><i class="fa-solid fa-check-circle"></i> Progresso salvo!</div>
      <div class="btn-group-footer">
        <button class="btn-action btn-reset" onclick="resetQuiz()"><i class="fa-solid fa-rotate-left"></i> Reiniciar Matéria</button>
        <button class="btn-action btn-save" onclick="manualSave()"><i class="fa-solid fa-floppy-disk"></i> Salvar Progresso</button>
      </div>
    </div>
  </div>

  <script>
    const subjectConfigs = {
      artes: { title: "Provas de Artes", subtitle: "Modo: Provas - Ensino Fundamental I" },
      religioso: { title: "Perguntas de Ensino Religioso", subtitle: "Modo: Perguntas - Ensino Fundamental I" },
      portugues: { title: "Provas de Língua Portuguesa", subtitle: "Modo: Provas - Ensino Fundamental I" }
    };

    let fullBank = {};
    let currentSubject = 'artes';
    let currentDifficulty = 'dificil';
    let activeQuestions = [];
    let userAnswers = {};

    async function fetchQuestionBank() {
      try {
        const response = await fetch('questoes.json');
        fullBank = await response.json();
        initApp();
      } catch (error) {
        document.getElementById('questionsContainer').innerHTML = 
          `<div class="loading-msg" style="color: #ef4444;">Erro ao carregar o arquivo 'questoes.json'. Verifique se ele está na mesma pasta.</div>`;
      }
    }

    function initApp() {
      loadSavedState();
      renderSubjectHeader();
      applyDifficultyFilter();
      renderQuestions();
      updateAnsweredCount();

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveStateToStorage();
      });
      window.addEventListener('beforeunload', saveStateToStorage);
    }

    function getStorageKey() { return `quiz_db_state_${currentSubject}`; }

    function saveStateToStorage() {
      const payload = { userAnswers: userAnswers, currentDifficulty: currentDifficulty };
      localStorage.setItem(getStorageKey(), JSON.stringify(payload));
    }

    function loadSavedState() {
      const saved = localStorage.getItem(getStorageKey());
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          userAnswers = parsed.userAnswers || {};
          currentDifficulty = parsed.currentDifficulty || 'dificil';
        } catch(e) { userAnswers = {}; }
      } else { userAnswers = {}; }
    }

    function switchSubject(btnElement, subjectKey) {
      saveStateToStorage();
      currentSubject = subjectKey;
      document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      loadSavedState();
      renderSubjectHeader();
      applyDifficultyFilter();
      renderQuestions();
      updateAnsweredCount();
    }

    function selectDifficulty(button, diff) {
      document.querySelectorAll('.btn-diff').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      currentDifficulty = diff;
      applyDifficultyFilter();
      renderQuestions();
      updateAnsweredCount();
      saveStateToStorage();
    }

    function applyDifficultyFilter() {
      const subjectData = fullBank[currentSubject] || [];
      if (currentDifficulty === 'facil') activeQuestions = subjectData.slice(0, 5);
      else if (currentDifficulty === 'medio') activeQuestions = subjectData.slice(0, 10);
      else activeQuestions = [...subjectData];
      document.getElementById('totalQuestions').innerText = activeQuestions.length;
    }

    function renderSubjectHeader() {
      const config = subjectConfigs[currentSubject];
      document.getElementById('modalTitle').innerText = config.title;
      document.getElementById('modalSubtitle').innerText = config.subtitle;
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      activeQuestions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${qIdx}`;

        const text = document.createElement('div');
        text.className = 'question-text';
        text.innerText = q.question;

        const optionsList = document.createElement('div');
        optionsList.className = 'options-list';

        const selectedOptIdx = userAnswers[qIdx];

        q.options.forEach((optText, optIdx) => {
          const optBtn = document.createElement('button');
          optBtn.className = 'option-btn' + (selectedOptIdx === optIdx ? ' selected' : '');
          optBtn.innerText = optText;
          optBtn.onclick = () => selectAnswer(qIdx, optIdx);
          optionsList.appendChild(optBtn);
        });

        const feedbackBox = document.createElement('div');
        feedbackBox.id = `feedback-${qIdx}`;
        feedbackBox.className = 'feedback-box';

        if (selectedOptIdx !== undefined) {
          const isCorrect = selectedOptIdx === q.correct;
          feedbackBox.className = `feedback-box ${isCorrect ? 'correct' : 'wrong'}`;
          feedbackBox.innerHTML = `
            <div><i class="fa-solid fa-circle-${isCorrect ? 'check' : 'xmark'}"></i> ${isCorrect ? 'Você acertou!' : 'Você errou!'}</div>
            <div><strong>Explicação:</strong> ${q.explanation}</div>
          `;
        }

        card.appendChild(text);
        card.appendChild(optionsList);
        card.appendChild(feedbackBox);
        container.appendChild(card);
      });
    }

    function selectAnswer(qIdx, optIdx) {
      userAnswers[qIdx] = optIdx;
      const card = document.getElementById(`q-card-${qIdx}`);
      
      card.querySelectorAll('.option-btn').forEach((btn, idx) => {
        btn.classList.toggle('selected', idx === optIdx);
      });

      const q = activeQuestions[qIdx];
      const feedbackBox = document.getElementById(`feedback-${qIdx}`);
      const isCorrect = optIdx === q.correct;

      feedbackBox.className = `feedback-box ${isCorrect ? 'correct' : 'wrong'}`;
      feedbackBox.innerHTML = `
        <div><i class="fa-solid fa-circle-${isCorrect ? 'check' : 'xmark'}"></i> ${isCorrect ? 'Você acertou!' : 'Você errou!'}</div>
        <div><strong>Explicação:</strong> ${q.explanation}</div>
      `;

      updateAnsweredCount();
      saveStateToStorage();
    }

    function updateAnsweredCount() {
      let count = 0;
      activeQuestions.forEach((_, idx) => {
        if (userAnswers[idx] !== undefined) count++;
      });
      document.getElementById('answeredCount').innerText = count;
    }

    function manualSave() {
      saveStateToStorage();
      const indicator = document.getElementById('saveStatusIndicator');
      indicator.classList.add('visible');
      setTimeout(() => indicator.classList.remove('visible'), 2500);
    }

    function resetQuiz() {
      if (confirm("Deseja apagar as respostas salvas desta matéria?")) {
        userAnswers = {};
        saveStateToStorage();
        renderQuestions();
        updateAnsweredCount();
        document.getElementById('questionsContainer').scrollTop = 0;
      }
    }

    window.onload = fetchQuestionBank;
  </script>
</body>
</html>
